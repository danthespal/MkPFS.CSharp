name: Release

# Push a version tag to publish:  git tag v2.0.0 && git push origin v2.0.0
# Every tag, with or without a suffix (-rc.1), is published as a normal release and marked latest.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  release:
    name: Publish GitHub release
    needs: [meta, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: mkpfs-*
          path: build

      # One archive per program and RID: mkpfs-<version>-<rid> and mkpfs-gui-<version>-<rid>.
      # Artifacts lose the executable bit, so restore it before archiving Unix builds.
      - name: Package archives
        run: |
          mkdir -p dist
          for dir in build/mkpfs-*; do
            base="${dir#build/}"
            if [[ "$base" == mkpfs-gui-* ]]; then product=mkpfs-gui; else product=mkpfs; fi
            rid="${base#"$product"-}"
            name="${product}-${VERSION}-${rid}"
            cp README.md LICENSE.md "$dir/"
            if [[ "$rid" == win-* ]]; then
              (cd "$dir" && zip -q -r "../../dist/${name}.zip" .)
            else
              find "$dir" -type f \( -name mkpfs -o -name mkpfs-gui \) -exec chmod +x {} +
              tar -C "$dir" -czf "dist/${name}.tar.gz" .
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Write release notes
        run: bash tools/ci/release-notes.sh "$TAG" "$GITHUB_REPOSITORY" > notes.md

      # Uploads each archive to VirusTotal (free API: 4 requests a minute) and links the reports in the
      # notes. Skipped without the VT_API_KEY secret; a VirusTotal outage does not block the release.
      - name: VirusTotal scan
        id: virustotal
        if: env.VT_API_KEY != ''
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          request_rate: 4
          files: |
            dist/*.zip
            dist/*.tar.gz

      # The action reports "file=url" pairs separated by commas; the URL may itself end in "=".
      - name: Add VirusTotal links to the notes
        if: steps.virustotal.outputs.analysis != ''
        env:
          ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          {
            printf '\n## VirusTotal\n\n'
            tr ',' '\n' <<< "$ANALYSIS" | while IFS='=' read -r file url; do
              if [[ -n "$file" ]]; then printf -- '- [%s](%s)\n' "$(basename "$file")" "$url"; fi
            done
          } >> notes.md

      - name: Create release
        run: gh release create "$TAG" dist/* --verify-tag --latest --title "MkPFS.C# ${VERSION}" --notes-file notes.md
