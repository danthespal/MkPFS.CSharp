name: Release

# Push a version tag to publish:  git tag v2.0.0-alpha.1 && git push origin v2.0.0-alpha.1
# Tags with a suffix (-alpha.1, -rc.1) become pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    name: CI
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  release:
    name: Publish GitHub release
    needs: [meta, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: mkpfs-*
          path: build

      # Artifacts lose the executable bit, so restore it before archiving Unix builds.
      - name: Package archives
        run: |
          mkdir -p dist
          for dir in build/mkpfs-*; do
            rid="${dir#build/mkpfs-}"
            name="mkpfs-${VERSION}-${rid}"
            cp README.md "$dir/"
            if [[ "$rid" == win-* ]]; then
              (cd "$dir" && zip -q -r "../../dist/${name}.zip" .)
            else
              chmod +x "$dir/mkpfs"
              tar -C "$dir" -czf "dist/${name}.tar.gz" .
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Write release notes
        run: bash tools/ci/release-notes.sh "$TAG" "$GITHUB_REPOSITORY" > notes.md

      - name: Create release
        env:
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "MkPFS ${VERSION}" --notes-file notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/* "${flags[@]}"
