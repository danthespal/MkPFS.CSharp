name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release.yml reuses this workflow so a release always ships binaries that passed CI.
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries (empty = Directory.Build.props default)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  oracle:
    name: Oracle corpus (Python MkPFS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout Python MkPFS
        uses: actions/checkout@v7
        with:
          repository: PSBrew/MkPFS
          path: mkpfs-python

      - uses: astral-sh/setup-uv@v7

      - name: Build golden corpus
        run: uv run --project mkpfs-python python tools/oracle/build_goldens.py --check

      # Artifacts drop empty directories, but they are part of the fixture trees (an empty directory
      # still takes a cluster in exFAT). Record them so the build jobs can restore them.
      - name: Record empty directories
        shell: bash
        working-directory: tests/fixtures/generated
        run: |
          find . -type d -empty | grep -Ev '^\./goldens/[^/]*/src(/|$)' > empty-dirs.txt || true
          find ./goldens/*ampr*/src -type d -empty >> empty-dirs.txt 2>/dev/null || true
          cat empty-dirs.txt

      - uses: actions/upload-artifact@v7
        with:
          name: oracle-corpus
          # Everything except the per-case source copies (identical to trees/).
          path: |
            tests/fixtures/generated
            !tests/fixtures/generated/goldens/*/src
          retention-days: 7

      # Packing AMPR trees writes ampr_emu.index into the case's source copy; verify needs that copy.
      - uses: actions/upload-artifact@v7
        with:
          name: oracle-corpus-ampr-src
          path: tests/fixtures/generated/goldens/*ampr*/src
          retention-days: 7

  build:
    name: Build and test (${{ matrix.rid }})
    needs: oracle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: oracle-corpus
          path: tests/fixtures/generated

      - uses: actions/download-artifact@v8
        with:
          name: oracle-corpus-ampr-src
          path: tests/fixtures/generated/goldens

      - name: Restore empty directories
        shell: bash
        working-directory: tests/fixtures/generated
        run: tr -d '\r' < empty-dirs.txt | while IFS= read -r dir; do mkdir -p "$dir"; done

      # vcvarsall.bat (used by native/build.ps1 and the AOT linker) calls vswhere.exe by name.
      - name: Put vswhere on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Build native zlib (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File native/build.ps1 -Rid ${{ matrix.rid }}

      - name: Build native zlib (Unix)
        if: runner.os != 'Windows'
        run: sh native/build.sh ${{ matrix.rid }}

      - name: Test
        run: dotnet test --solution MkPFS.slnx -c Release

      - name: Install AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish (Native AOT)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet publish src/MkPFS.Cli -r ${{ matrix.rid }} -c Release -o publish ${VERSION:+-p:Version=$VERSION}

      - name: Smoke test
        shell: bash
        run: |
          ./publish/mkpfs --version
          ./publish/mkpfs selftest

      - uses: actions/upload-artifact@v7
        with:
          name: mkpfs-${{ matrix.rid }}
          path: |
            publish/*
            !publish/*.pdb
            !publish/*.dbg
            !publish/*.dSYM
          retention-days: 7

      - name: Publish GUI (Native AOT)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet publish src/MkPFS.Gui -r ${{ matrix.rid }} -c Release -o publish-gui ${VERSION:+-p:Version=$VERSION}

      # Loads the string tables and the native zlib without opening a window.
      - name: Smoke test GUI
        shell: bash
        run: ./publish-gui/mkpfs-gui --selftest

      # macOS gets an app bundle; elsewhere the folder ships as is. Debug symbols and the CLI's
      # runtimeconfig (copied in by the project reference) stay out.
      - name: Stage GUI
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p gui
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash tools/ci/macos-app.sh publish-gui gui "${VERSION:-0.0.0}"
          else
            cp -R publish-gui/. gui/
            find gui \( -name '*.pdb' -o -name '*.dbg' -o -name '*.runtimeconfig.json' \) -prune -exec rm -rf {} +
          fi
          find gui -maxdepth 3 | sort

      - uses: actions/upload-artifact@v7
        with:
          name: mkpfs-gui-${{ matrix.rid }}
          path: gui
          retention-days: 7
