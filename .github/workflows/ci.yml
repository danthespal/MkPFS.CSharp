name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release.yml reuses this workflow so a release always ships binaries that passed CI.
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries (empty = Directory.Build.props default)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  oracle:
    name: Oracle corpus (Python MkPFS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout Python MkPFS
        uses: actions/checkout@v7
        with:
          repository: PSBrew/MkPFS
          path: mkpfs-python

      - uses: astral-sh/setup-uv@v7

      - name: Build golden corpus
        run: uv run --project mkpfs-python python tools/oracle/build_goldens.py --check

      # Artifacts drop empty directories, but they are part of the fixture trees (an empty directory
      # still takes a cluster in exFAT). Record them so the build jobs can restore them.
      - name: Record empty directories
        shell: bash
        working-directory: tests/fixtures/generated
        run: |
          find . -type d -empty | grep -Ev '^\./goldens/[^/]*/src(/|$)' > empty-dirs.txt || true
          find ./goldens/*ampr*/src -type d -empty >> empty-dirs.txt 2>/dev/null || true
          cat empty-dirs.txt

      - uses: actions/upload-artifact@v7
        with:
          name: oracle-corpus
          # Everything except the per-case source copies (identical to trees/).
          path: |
            tests/fixtures/generated
            !tests/fixtures/generated/goldens/*/src
          retention-days: 7

      # Packing AMPR trees writes ampr_emu.index into the case's source copy; verify needs that copy.
      - uses: actions/upload-artifact@v7
        with:
          name: oracle-corpus-ampr-src
          path: tests/fixtures/generated/goldens/*ampr*/src
          retention-days: 7

  # The AMPR pack and FPKG parity tests skip without these corpora. Windows: the PS5PkgTool runner is an .exe.
  oracle-extra:
    name: Oracle corpus (AMPR packs, FPKG)
    runs-on: windows-latest
    env:
      # The oracle scripts refuse any other commit.
      AMPR_EMU_COMMIT: cfa85df379f6eeeb165d7badf9b648e266fe77b7
      LIBPROSPEROPKG_COMMIT: 748eabf1b7d17819528cabf367d8e27109d8fce3
      PS5PKGTOOL_COMMIT: 61874dfe0f4bbf23c61d421010c9fd86bb3a68d2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@v7

      # The scripts expect each oracle next to this repository (../<name>), which actions/checkout cannot write.
      - name: Check out oracles
        shell: bash
        run: |
          fetch() {
            git init -q "../$1"
            git -C "../$1" fetch -q --depth 1 "https://github.com/$2.git" "$3"
            git -C "../$1" checkout -q FETCH_HEAD
          }
          fetch ampr_emu drakmor/ampr_emu "$AMPR_EMU_COMMIT"
          fetch LibProsperoPKG SvenGDK/LibProsperoPKG "$LIBPROSPEROPKG_COMMIT"
          fetch PS5PkgTool pearlxcore/PS5PkgTool "$PS5PKGTOOL_COMMIT"

      - name: Build AMPR pack corpus (ampr_pack.py)
        run: uv run --no-project --python 3.11 --with lz4==4.4.5 python tools/oracle/build_ampr_goldens.py

      - name: Build FPKG corpus (LibProsperoPKG)
        run: uv run --no-project --python 3.11 python tools/oracle-fpkg/build_fpkg_goldens.py

      - name: Build FPKG corpus (PS5PkgTool)
        run: uv run --no-project --python 3.11 python tools/oracle-ppt/build_ppt_goldens.py

      # A tar keeps the file times the AMPR goldens pin and the empty directories; artifacts keep neither.
      - name: Archive corpus
        shell: bash
        run: tar -czf oracle-extra.tgz -C tests/fixtures/generated ampr fpkg

      - uses: actions/upload-artifact@v7
        with:
          name: oracle-corpus-extra
          path: oracle-extra.tgz
          compression-level: 0
          retention-days: 7

  build:
    name: Build and test (${{ matrix.rid }})
    needs: [oracle, oracle-extra]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: oracle-corpus
          path: tests/fixtures/generated

      - uses: actions/download-artifact@v8
        with:
          name: oracle-corpus-ampr-src
          path: tests/fixtures/generated/goldens

      - name: Restore empty directories
        shell: bash
        working-directory: tests/fixtures/generated
        run: tr -d '\r' < empty-dirs.txt | while IFS= read -r dir; do mkdir -p "$dir"; done

      - uses: actions/download-artifact@v8
        with:
          name: oracle-corpus-extra

      - name: Extract AMPR and FPKG corpus
        shell: bash
        run: tar -xzf oracle-extra.tgz -C tests/fixtures/generated && rm oracle-extra.tgz

      # vcvarsall.bat (used by native/build.ps1 and the AOT linker) calls vswhere.exe by name.
      - name: Put vswhere on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Build native zlib (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File native/build.ps1 -Rid ${{ matrix.rid }}

      - name: Build native zlib (Unix)
        if: runner.os != 'Windows'
        run: sh native/build.sh ${{ matrix.rid }}

      - name: Test
        run: dotnet test --solution MkPFS.slnx -c Release

      - name: Install AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish (Native AOT)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet publish src/MkPFS.Cli -r ${{ matrix.rid }} -c Release -o publish ${VERSION:+-p:Version=$VERSION}

      - name: Smoke test
        shell: bash
        run: |
          ./publish/mkpfs --version
          ./publish/mkpfs selftest

      - uses: actions/upload-artifact@v7
        with:
          name: mkpfs-${{ matrix.rid }}
          path: |
            publish/*
            !publish/*.pdb
            !publish/*.dbg
            !publish/*.dSYM
          retention-days: 7

      - name: Publish GUI (Native AOT)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet publish src/MkPFS.Gui -r ${{ matrix.rid }} -c Release -o publish-gui ${VERSION:+-p:Version=$VERSION}

      # Loads the string tables and the native zlib without opening a window.
      - name: Smoke test GUI
        shell: bash
        run: ./publish-gui/mkpfs-gui --selftest

      # macOS gets an app bundle; elsewhere the folder ships as is. Debug symbols and the CLI's
      # runtimeconfig (copied in by the project reference) stay out.
      - name: Stage GUI
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p gui
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash tools/ci/macos-app.sh publish-gui gui "${VERSION:-0.0.0}"
          else
            cp -R publish-gui/. gui/
            find gui \( -name '*.pdb' -o -name '*.dbg' -o -name '*.runtimeconfig.json' \) -prune -exec rm -rf {} +
          fi
          find gui -maxdepth 3 | sort

      - uses: actions/upload-artifact@v7
        with:
          name: mkpfs-gui-${{ matrix.rid }}
          path: gui
          retention-days: 7
